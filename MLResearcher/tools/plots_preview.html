<meta charset="utf-8">
<title>Plots preview — ML Researcher sim</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9;
    --dim:#8b949e; --good:#3fb950; --bad:#f85149; --warn:#d29922; --accent:#39c5cf;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:12px/1.4 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;}
  #bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel);}
  #bar b{color:var(--accent);letter-spacing:.06em}
  label{color:var(--dim);cursor:pointer;user-select:none}
  label input{vertical-align:-1px;margin-right:4px}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;}
  .cell{background:var(--panel);border:1px solid var(--border);position:relative}
  .cell h2{margin:0;padding:3px 8px;font-size:10px;font-weight:600;letter-spacing:.09em;
    color:var(--dim);border-bottom:1px solid var(--border);background:#12161d}
  canvas{display:block;width:100%;height:398px}
  .cell.tiny canvas{width:40px;height:18px}
  #err{color:var(--bad);padding:0 10px;white-space:pre-wrap}
</style>

<div id="bar">
  <b>PLOTS PREVIEW</b>
  <label><input type="radio" name="ds" value="normal" checked> normal</label>
  <label><input type="radio" name="ds" value="empty"> no series</label>
  <label><input type="radio" name="ds" value="single"> single point</label>
  <label><input type="radio" name="ds" value="zerowidth"> zero-width CI</label>
  <label><input type="radio" name="ds" value="allequal"> all-equal values</label>
  <label><input type="radio" name="ds" value="junk"> missing / non-finite</label>
  <label><input type="radio" name="ds" value="one"> one series only</label>
  <label><input type="radio" name="ds" value="many"> 8 series, 1-seed noise</label>
  <label><input type="radio" name="ds" value="biased"> measured far from truth</label>
  <label><input type="radio" name="ds" value="rows40"> forest: 40 rows</label>
  <label><input type="checkbox" id="tiny"> near-zero canvas</label>
  <span id="err"></span>
</div>

<div id="grid">
  <div class="cell"><h2>scaling()</h2><canvas id="c-scaling"></canvas></div>
  <div class="cell"><h2>forest()</h2><canvas id="c-forest"></canvas></div>
  <div class="cell"><h2>truth() — debrief only</h2><canvas id="c-truth"></canvas></div>
  <div class="cell"><h2>budget()</h2><canvas id="c-budget"></canvas></div>
</div>

<script src="../sim/plots.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- seeded PRNG (mirrors Lab's contract: never Math.random) ---- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gauss(rnd) {
    var u = 0, v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  /* ---------- synthetic world -------------------------------------------- */
  var NREF = 7.0e7, RUN = 7.0e10;
  var SCALES = [
    { id: '70m',  params: 7.0e7,  sigma: 1.80 },
    { id: '300m', params: 3.0e8,  sigma: 1.20 },
    { id: '1p4b', params: 1.4e9,  sigma: 0.80 },
    { id: '7b',   params: 7.0e9,  sigma: 0.50 }
  ];
  /* hidden truth: effect(N) = c + a*(Nref/N)^gamma  */
  var TRUE = [
    { id: 'rope_scaling_v2',      label: 'RoPE scaling v2',      c:  2.60, a:  0.30, gamma: 1.00 },
    { id: 'doc_packing_boundary', label: 'Doc packing boundary', c:  1.40, a:  2.20, gamma: 0.55 },
    { id: 'long_ctx_data_mix',    label: 'Long-ctx data mix',    c:  3.10, a: -1.10, gamma: 0.40 },
    { id: 'attn_sink_tokens',     label: 'Attention sink tokens',c:  0.15, a:  3.40, gamma: 0.85 },
    { id: 'qk_norm',              label: 'QK-norm',              c:  0.90, a:  0.10, gamma: 1.20 },
    { id: 'lr_warmup_long',       label: 'Long LR warmup',       c: -0.80, a:  2.60, gamma: 0.70 },
    { id: 'mup_transfer',         label: 'muP transfer',         c:  1.85, a: -0.45, gamma: 0.60 },
    { id: 'grouped_kv_8',         label: 'Grouped KV (8)',       c: -1.30, a:  0.55, gamma: 0.90 }
  ];
  function trueEffect(t, N) { return t.c + t.a * Math.pow(NREF / N, t.gamma); }

  /* a plausible experiment log: not every intervention measured at every
     scale, seed counts vary (1 seed => ~2x the sigma of 4 seeds) */
  function buildSeries(mode) {
    var rnd = mulberry32(20260816);
    var out = [];
    var howMany = mode === 'one' ? 1 : (mode === 'many' ? 8 : 5);
    for (var i = 0; i < howMany; i++) {
      var t = TRUE[i];
      var pts = [];
      for (var s = 0; s < SCALES.length; s++) {
        var sc = SCALES[s];
        /* bigger scales are rarer: you could not afford many 7B runs */
        var p = [0.95, 0.85, 0.6, 0.35][s];
        if (rnd() > p && !(mode === 'many')) continue;
        var seeds = mode === 'many' ? 1 : [1, 1, 2, 4][Math.floor(rnd() * 4)];
        var sigma = sc.sigma / Math.sqrt(seeds);
        var obs = trueEffect(t, sc.params) + gauss(rnd) * sigma;
        pts.push({ params: sc.params, effect: obs,
                   ciLow: obs - 1.96 * sigma, ciHigh: obs + 1.96 * sigma, n: seeds });
      }
      if (!pts.length) pts.push({ params: 7.0e7, effect: trueEffect(t, 7e7),
                                  ciLow: trueEffect(t, 7e7) - 3.5, ciHigh: trueEffect(t, 7e7) + 3.5, n: 1 });
      out.push({ id: t.id, label: t.label, points: pts });
    }
    return out;
  }

  function mutate(series, mode) {
    var i, j;
    if (mode === 'empty') return [];
    if (mode === 'biased') {
      /* a run of bad luck / a subtly broken eval: the truth lands OUTSIDE
         several measured CIs, which is exactly what truth() must expose */
      var r2 = mulberry32(7);
      for (i = 0; i < series.length; i++)
        for (j = 0; j < series[i].points.length; j++) {
          var b = series[i].points[j];
          var shift = (r2() < 0.5 ? -1 : 1) * (2.5 + r2() * 3.5);
          b.effect += shift; b.ciLow += shift; b.ciHigh += shift;
        }
      return series;
    }
    if (mode === 'single') {
      for (i = 0; i < series.length; i++) series[i].points = series[i].points.slice(0, 1);
      return series.slice(0, 3);
    }
    if (mode === 'zerowidth') {
      for (i = 0; i < series.length; i++)
        for (j = 0; j < series[i].points.length; j++) {
          var p = series[i].points[j];
          p.ciLow = p.effect; p.ciHigh = p.effect;
        }
      return series;
    }
    if (mode === 'allequal') {
      for (i = 0; i < series.length; i++)
        for (j = 0; j < series[i].points.length; j++) {
          series[i].points[j].effect = 2;
          series[i].points[j].ciLow = 2;
          series[i].points[j].ciHigh = 2;
        }
      return series;
    }
    if (mode === 'junk') {
      var junkVals = [NaN, Infinity, -Infinity, undefined, null, 'x', {}];
      var k = 0;
      for (i = 0; i < series.length; i++) {
        for (j = 0; j < series[i].points.length; j++) {
          var q = series[i].points[j];
          if ((i + j) % 3 === 0) q.effect = junkVals[(k++) % junkVals.length];
          if ((i + j) % 4 === 1) q.ciHigh = junkVals[(k++) % junkVals.length];
          if ((i + j) % 5 === 2) q.params = junkVals[(k++) % junkVals.length];
        }
        if (i % 3 === 2) series[i].points.push(null);
      }
      series.push(null);
      series.push({ id: 'no_points', label: 'never ran', points: [] });
      return series;
    }
    return series;
  }

  function forestRows(series, mode) {
    var rows = [];
    for (var i = 0; i < series.length; i++) {
      var s = series[i];
      if (!s || !s.points || !s.points.length) continue;
      /* use the largest scale measured for that intervention */
      var best = null;
      for (var j = 0; j < s.points.length; j++) {
        var p = s.points[j];
        if (!p) continue;
        if (!best || (typeof p.params === 'number' && p.params > best.params)) best = p;
      }
      if (!best) continue;
      rows.push({ label: s.label, effect: best.effect,
                  ciLow: best.ciLow, ciHigh: best.ciHigh, n: best.n });
    }
    if (mode === 'junk') {
      rows.push({ label: 'broken row', effect: NaN, ciLow: 1, ciHigh: 'z', n: null });
      rows.push(null);
    }
    if (mode === 'rows40') {
      /* every experiment as its own row, not just every intervention */
      var r3 = mulberry32(3);
      rows = [];
      for (var k = 0; k < 40; k++) {
        var e = (r3() - 0.45) * 8, sg = 0.4 + r3() * 2.2;
        rows.push({ label: TRUE[k % 8].label + ' @' + SCALES[k % 4].id,
                    effect: e, ciLow: e - 1.96 * sg, ciHigh: e + 1.96 * sg, n: (k % 4) + 1 });
      }
    }
    return rows;
  }

  function budgetCfg(mode) {
    if (mode === 'empty') return { used: 0, total: 6000, byScale: {} };
    if (mode === 'junk')  return { used: NaN, total: 0, byScale: { '70m': 120, '300m': NaN, '1p4b': 'x', '7b': 900 } };
    if (mode === 'allequal') return { used: 6400, total: 6000, byScale: { '70m': 1600, '300m': 1600, '1p4b': 1600, '7b': 1600 } };
    return { used: 3940, total: 6000, byScale: { '70m': 264, '300m': 585, '1p4b': 1330, '7b': 1700 } };
  }

  /* ---------- wire it up -------------------------------------------------- */
  var plots = {};
  ['scaling', 'forest', 'truth', 'budget'].forEach(function (k) {
    plots[k] = window.Plots.create(document.getElementById('c-' + k), { theme: 'dark' });
  });

  function currentMode() {
    var els = document.getElementsByName('ds');
    for (var i = 0; i < els.length; i++) if (els[i].checked) return els[i].value;
    return 'normal';
  }

  function render() {
    var err = document.getElementById('err');
    err.textContent = '';
    var mode = currentMode();
    var tiny = document.getElementById('tiny').checked;
    var cells = document.getElementsByClassName('cell');
    for (var i = 0; i < cells.length; i++) cells[i].className = tiny ? 'cell tiny' : 'cell';

    try {
      var series = mutate(buildSeries(mode), mode);
      var curves = [];
      for (var t = 0; t < TRUE.length; t++) {
        (function (tt) {
          curves.push({ id: tt.id, label: tt.label, fn: function (N) { return trueEffect(tt, N); } });
        })(TRUE[t]);
      }
      if (mode === 'junk') {
        curves.push({ id: 'bad_curve', label: 'throwing curve', fn: function () { throw new Error('boom'); } });
        curves.push({ id: 'nan_curve', label: 'NaN curve', fn: function () { return NaN; } });
        curves.push(null);
      }

      plots.scaling.scaling({ series: series, runScale: RUN, metric: 'LCR@128k' });
      plots.forest.forest({ rows: forestRows(series, mode), metric: 'LCR@128k · largest scale measured' });
      plots.truth.truth({ series: series, truthCurves: curves, runScale: RUN, metric: 'LCR@128k' });
      plots.budget.budget(budgetCfg(mode));
    } catch (e) {
      err.textContent = 'HARNESS THREW: ' + (e && e.stack ? e.stack : e);
    }
  }

  var inputs = document.querySelectorAll('#bar input');
  for (var i = 0; i < inputs.length; i++) inputs[i].addEventListener('change', render);

  /* #mode=junk&tiny=1 — lets a headless screenshot pick a case */
  function applyHash() {
    var h = String(location.hash || '').replace(/^#/, '');
    if (!h) return;
    var parts = h.split('&'), q = {};
    for (var k = 0; k < parts.length; k++) {
      var kv = parts[k].split('=');
      q[kv[0]] = kv[1];
    }
    if (q.only) {
      /* #only=truth — blow one plot up full-window for detail inspection */
      var cells = document.getElementsByClassName('cell');
      document.getElementById('grid').style.gridTemplateColumns = '1fr';
      for (var c = 0; c < cells.length; c++) {
        var cv = cells[c].getElementsByTagName('canvas')[0];
        if (cv && cv.id === 'c-' + q.only) cv.style.height = (window.innerHeight - 70) + 'px';
        else cells[c].style.display = 'none';
      }
    }
    if (q.mode) {
      var els = document.getElementsByName('ds');
      for (var j = 0; j < els.length; j++) els[j].checked = (els[j].value === q.mode);
    }
    document.getElementById('tiny').checked = q.tiny === '1';
  }
  applyHash();
  window.addEventListener('hashchange', function () { applyHash(); render(); });
  window.addEventListener('resize', function () {
    for (var k in plots) if (plots.hasOwnProperty(k)) plots[k].resize();
  });
  window.__render = render;
  render();
})();
</script>
